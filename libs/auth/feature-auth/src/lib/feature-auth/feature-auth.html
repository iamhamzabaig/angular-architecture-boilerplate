<p>FeatureAuth works!</p>
<section class="auth-layout">
  <mat-card class="auth-card">
    <h1 i18n="@@auth.title">Sign in to continue</h1>
    <p class="helper-text">
      Use demo credentials to access the protected dashboard.
    </p>

    <form [formGroup]="form" (ngSubmit)="signIn()">
      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput type="email" formControlName="email" autocomplete="email" />
        <mat-error *ngIf="form.controls.email.hasError('email')">
          Please provide a valid email address.
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Password</mat-label>
        <input matInput type="password" formControlName="password" autocomplete="current-password" />
        <mat-error *ngIf="form.controls.password.hasError('minlength')">
          Password must be at least 6 characters.
        </mat-error>
      </mat-form-field>

      <button mat-flat-button color="primary" type="submit" [disabled]="requestPending()">
        <span i18n="@@auth.button">Sign in</span>
        <mat-spinner *ngIf="requestPending()" diameter="18"></mat-spinner>
      </button>
    </form>

    <p class="error-text" *ngIf="requestError() as error">{{ error }}</p>
  </mat-card>
</section>
